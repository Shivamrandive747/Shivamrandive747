<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-label="Do graph neural networks work on unseen materials?"><rect x=".5" y=".5" width="619" height="359" rx="16" fill="#161b22" stroke="#30363d"/><rect x="0" y="0" width="620" height="5" rx="2" fill="#79c0ff"/><rect x="28" y="26" width="81" height="30" rx="6" fill="#79c0ff"/><text x="69" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#0d1117" text-anchor="middle">REPORT</text><text x="121" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#9198a1">SRFP 2025 · S. N. Bose Centre</text><text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#e6edf3">Do graph neural networks work on</text><text x="28" y="137" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#e6edf3">unseen materials?</text><text x="28" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-style="italic" fill="#9198a1">High accuracy on familiar data is not discovery: breadth</text><text x="28" y="205" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-style="italic" fill="#9198a1">of training data decides how a model generalizes.</text><rect x="28" y="250" width="179" height="86" rx="10" fill="#1c2533"/><text x="42" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#79c0ff">&gt;92%</text><text x="42" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">specialists,</text><text x="42" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">familiar data</text><rect x="221" y="250" width="179" height="86" rx="10" fill="#1c2533"/><text x="235" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#79c0ff">≈48%</text><text x="235" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">specialists, unseen</text><text x="235" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">perovskites</text><rect x="413" y="250" width="179" height="86" rx="10" fill="#1c2533"/><text x="427" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#79c0ff">≈80%</text><text x="427" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">pretrained model,</text><text x="427" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9198a1">unseen</text></svg>