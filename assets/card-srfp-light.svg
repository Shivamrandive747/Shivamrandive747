<svg xmlns="http://www.w3.org/2000/svg" width="620" height="360" viewBox="0 0 620 360" role="img" aria-label="Do graph neural networks work on unseen materials?"><rect x=".5" y=".5" width="619" height="359" rx="16" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0" y="0" width="620" height="5" rx="2" fill="#0b4f8a"/><rect x="28" y="26" width="81" height="30" rx="6" fill="#0b4f8a"/><text x="69" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#ffffff" text-anchor="middle">REPORT</text><text x="121" y="47" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#59636e">SRFP 2025 · S. N. Bose Centre</text><text x="28" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1f2328">Do graph neural networks work on</text><text x="28" y="137" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#1f2328">unseen materials?</text><text x="28" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-style="italic" fill="#59636e">High accuracy on familiar data is not discovery: breadth</text><text x="28" y="205" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18.5" font-style="italic" fill="#59636e">of training data decides how a model generalizes.</text><rect x="28" y="250" width="179" height="86" rx="10" fill="#eef3f8"/><text x="42" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#0b4f8a">&gt;92%</text><text x="42" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">specialists,</text><text x="42" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">familiar data</text><rect x="221" y="250" width="179" height="86" rx="10" fill="#eef3f8"/><text x="235" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#0b4f8a">≈48%</text><text x="235" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">specialists, unseen</text><text x="235" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">perovskites</text><rect x="413" y="250" width="179" height="86" rx="10" fill="#eef3f8"/><text x="427" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#0b4f8a">≈80%</text><text x="427" y="308" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">pretrained model,</text><text x="427" y="326" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15.5" fill="#59636e">unseen</text></svg>